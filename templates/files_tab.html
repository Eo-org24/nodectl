<div class="terminal-card p-6">
    <div class="border-b border-[#9d00ff] pb-3 mb-6 flex justify-between items-center">
        <div>
            <h2 class="text-lg font-bold tracking-wider text-glow uppercase">File Explorer</h2>
            <p class="text-[10px] text-[#9d00ff] font-mono mt-0.5 uppercase tracking-wide">Manage Staged Payloads & Transfers</p>
        </div>
        <button hx-get="/api/files/list" hx-target="#files-output" class="btn-terminal text-xs px-4 py-1.5 uppercase font-bold tracking-wide">
            Refresh
        </button>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="space-y-4">
            <h3 class="text-sm font-bold text-[#ff00ff] uppercase tracking-wider mb-2">Status</h3>
            <div class="space-y-4 border border-[#9d00ff] p-4 bg-[#1a002a] font-mono text-sm text-[#9d00ff]">
                <p>Read-only phase: upload, transfer, and delete flows are intentionally disabled until they are rebound to the current validated file service.</p>
                <div id="files-upload-status" class="text-sm font-mono"></div>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="text-sm font-bold text-[#ff00ff] uppercase tracking-wider mb-2">Staged Files</h3>
            <div id="files-output" hx-get="/api/files/list" hx-trigger="load, filesChanged from:body" class="bg-[#1a002a] border border-[#9d00ff] min-h-[150px] p-2">
                <p class="text-sm text-[#9d00ff] italic font-mono">Loading files...</p>
            </div>
        </div>
    </div>
</div>
