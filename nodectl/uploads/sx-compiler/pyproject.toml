[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sx-compiler"
version = "0.1.0"
description = "Local-first LLM wiki compiler scaffold."
readme = "docs/PROJECT_PRIMER.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
