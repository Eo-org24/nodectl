{% extends "base.html" %}
{% block body %}
<main class="login-shell">
    <section class="login-panel">
        <p class="eyebrow">Neon gate // authorized operators only</p>
        <h1 class="hero-title">NodePanel Sign In</h1>
        <p class="hero-copy">Authenticate before opening terminal sessions, approving host keys, or moving payloads across the dataplane.</p>
        {% if error %}
        <p class="error-banner">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login" class="login-form">
            <label class="input-block">
                <span>Username</span>
                <input class="vapor-input" type="text" name="username" required>
            </label>
            <label class="input-block">
                <span>Password</span>
                <input class="vapor-input" type="password" name="password" required>
            </label>
            <button class="chrome-button wide" type="submit">Enter control plane</button>
        </form>
    </section>
</main>
{% endblock %}
