<div class="terminal-card p-6">
    <div class="border-b border-[#9d00ff] pb-3 mb-6">
        <h2 class="text-lg font-bold tracking-wider text-glow uppercase">VM SSH Configuration</h2>
        <p class="text-[10px] text-[#9d00ff] font-mono mt-0.5 uppercase tracking-wide">Configure credentials for targeting guest VMs</p>
    </div>
    
    {% if read_only %}
        <div class="space-y-4 font-mono text-sm text-[#9d00ff]">
            <p>Configuration editing is intentionally disabled in phase 1. Runtime settings remain environment-managed.</p>
            <div class="border border-[#9d00ff] bg-[#0a001a] p-4 space-y-2">
                <div><span class="text-[#ff2a9d]">VM SSH Username:</span> {{ vm_ssh_user }}</div>
                <div><span class="text-[#ff2a9d]">VM SSH Key Path:</span> {{ vm_ssh_key_path }}</div>
            </div>
        </div>
    {% else %}
        <form hx-post="/api/config/save" hx-target="#config-status" class="space-y-4">
            <div>
                <label for="vm_ssh_user" class="block text-xs text-[#ff2a9d] uppercase tracking-wider mb-2 font-bold font-mono">VM SSH Username</label>
                <input type="text" id="vm_ssh_user" name="vm_ssh_user" value="{{ vm_ssh_user }}" required class="w-full bg-[#0a001a] border border-[#9d00ff] text-[#ff00ff] px-3 py-2 text-sm focus:outline-none focus:border-[#ff00ff] font-mono">
            </div>
            <div>
                <label for="vm_ssh_key_path" class="block text-xs text-[#ff2a9d] uppercase tracking-wider mb-2 font-bold font-mono">VM SSH Private Key Path</label>
                <input type="text" id="vm_ssh_key_path" name="vm_ssh_key_path" value="{{ vm_ssh_key_path }}" class="w-full bg-[#0a001a] border border-[#9d00ff] text-[#ff00ff] px-3 py-2 text-sm focus:outline-none focus:border-[#ff00ff] font-mono">
            </div>
            <div>
                <label for="vm_ssh_password" class="block text-xs text-[#ff2a9d] uppercase tracking-wider mb-2 font-bold font-mono">VM SSH Password (Optional)</label>
                <input type="password" id="vm_ssh_password" name="vm_ssh_password" value="" placeholder="Leave blank to keep current" class="w-full bg-[#0a001a] border border-[#9d00ff] text-[#ff00ff] px-3 py-2 text-sm focus:outline-none focus:border-[#ff00ff] font-mono">
            </div>
            <div class="flex items-center gap-4">
                <button type="submit" class="btn-terminal text-sm px-6 py-2 uppercase font-bold tracking-wide">
                    Save Config
                </button>
                <div id="config-status"></div>
            </div>
        </form>
    {% endif %}
</div>
