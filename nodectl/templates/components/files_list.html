<div class="space-y-2">
    {% for f in files %}
    <div class="flex justify-between items-center bg-[#1a002a] p-2 border border-[#9d00ff]">
        <div class="font-mono text-sm text-[#ff2a9d] truncate flex-1" title="{{ f.name }}">{{ f.name }} <span class="text-[10px] text-[#9d00ff]">({{ f.size }} bytes)</span></div>
        {% if not read_only %}
            <div class="flex gap-2">
                <button hx-get="/api/files/read?path={{ f.url_name }}" hx-target="#files-output" class="text-[10px] uppercase font-bold text-[#ff00ff] hover:text-white">View</button>
                <button hx-post="/api/files/transfer?path={{ f.url_name }}" hx-target="#files-upload-status" class="text-[10px] uppercase font-bold text-[#00ffaa] hover:text-white">Transfer</button>
                <button hx-post="/api/files/delete?path={{ f.url_name }}" hx-target="#files-upload-status" hx-confirm="Delete {{ f.name }}?" class="text-[10px] uppercase font-bold text-red-400 hover:text-red-300">Del</button>
            </div>
        {% endif %}
    </div>
    {% else %}
    <div class="text-[#9d00ff] text-sm font-mono italic">No files in staging.</div>
    {% endfor %}
</div>
